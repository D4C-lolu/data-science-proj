services:
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-indices}:${POSTGRES_PASSWORD:-indices-dev-password}@db:5432/${POSTGRES_DB:-indices}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 run:app
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-deploying}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-indices}:${POSTGRES_PASSWORD:-indices-dev-password}@db:5432/${POSTGRES_DB:-indices}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      UPLOAD_FOLDER: /data/uploads
      RESULT_FOLDER: /data/results
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-52428800}
    volumes:
      - uploads:/data/uploads
      - results:/data/results
      - ../:/reference:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A celery_app.celery worker --loglevel=info
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-deploying}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-indices}:${POSTGRES_PASSWORD:-indices-dev-password}@db:5432/${POSTGRES_DB:-indices}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      UPLOAD_FOLDER: /data/uploads
      RESULT_FOLDER: /data/results
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-52428800}
    volumes:
      - uploads:/data/uploads
      - results:/data/results
      - ../:/reference:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indices}
      POSTGRES_USER: ${POSTGRES_USER:-indices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indices-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indices} -d ${POSTGRES_DB:-indices}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
  results:
