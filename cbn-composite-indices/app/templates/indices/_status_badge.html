{% if run.status == 'succeeded' %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-700">
  <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>Succeeded
</span>
{% elif run.status == 'failed' %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-2.5 py-1 text-xs font-medium text-red-700">
  <span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>Failed
</span>
{% elif run.status == 'running' %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-700">
  <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-amber-500"></span>Running
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600">
  <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>Queued
</span>
{% endif %}
